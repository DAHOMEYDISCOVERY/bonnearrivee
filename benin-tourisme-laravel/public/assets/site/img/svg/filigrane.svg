<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180">
    <!--
        Filigrane du portail Bonne Arrivée — lettre B stylisée, blanche
        opaque sur fond transparent. Utilisé comme mask-image via la
        règle .bg-filigrane:before, donc seule la forme compte : la
        couleur est plaquée par background-color côté CSS.

        Remplace le motif M hérité du thème Mayotte : mêmes dimensions
        de mask (mask-size:370px, mask-position:bottom left), donc
        aucune modification CSS nécessaire.
    -->
    <g fill="#fff" opacity=".9">
        <!-- Barre verticale gauche -->
        <rect x="20" y="20" width="28" height="140" rx="4"/>
        <!-- Boucle supérieure du B -->
        <path d="M20 20 h48 a42 40 0 0 1 0 80 h-48 z M48 40 h20 a20 20 0 0 1 0 40 h-20 z"
              fill-rule="evenodd"/>
        <!-- Boucle inférieure du B (plus grande, comme un B typographique) -->
        <path d="M20 88 h56 a46 46 0 0 1 0 72 h-56 z M48 108 h28 a22 22 0 0 1 0 44 h-28 z"
              fill-rule="evenodd"/>
    </g>
</svg>
